# By default PostgreSQL (with pgvector) runs here: COMPOSE_PROFILES=local-db in .env.
# For an external database remove that line and set DATABASE_URL in .env; the db container is then not started.
x-database-url: &database-url ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/jedi_mind_agent}

services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: *database-url
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
        required: false
      rag:
        condition: service_started

  rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    env_file:
      - .env
    environment:
      DATABASE_URL: *database-url
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: jedi_mind_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d jedi_mind_agent" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  media:
  postgres_data:
